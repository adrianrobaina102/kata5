upstream distance_1 {
    zone distance_1 64k;
    resolver consul:8600 valid=5s;
    server service.consul service=distance_service_v1 resolve;
}

upstream temperature_1 {
    zone temperature_1 64k;
    resolver consul:8600 valid=5s;
    server service.consul service=temperature_service_v1 resolve;
}

server {
    listen 80;

    add_header X-Backend $upstream_addr always;

    location /api/v1/distance/ {
        proxy_pass http://distance_1/;
    }

    location /api/v1/temperature/ {
        proxy_pass http://temperature_1/;
    }

    location / {
        return 404;
    }
}
