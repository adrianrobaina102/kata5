upstream books_1 {
    zone books_1 64k;
    resolver consul:8600 valid=5s;
    server service.consul service=books_service_v1 resolve;
}

upstream books_2 {
    zone books_2 64k;
    resolver consul:8600 valid=5s;
    server service.consul service=books_service_v2 resolve;
}

server {
    listen 80;

    add_header X-Backend $upstream_addr always;

    location /api/v1/books/ {
        proxy_pass http://books_1/;
    }

    location /api/v2/books/ {
        proxy_pass http://books_2/;
    }

    location / {
        return 404;
    }
}
