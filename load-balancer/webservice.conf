upstream fibonacci_1 {
    zone fibonacci_1 64k;
    resolver consul:8600 valid=5s;
    server service.consul service=fibonacci_service_v1 resolve;
}
upstream random_1 {
    zone random_1 64k;
    resolver consul:8600 valid=5s;
    server service.consul service=random_service_v1 resolve;
}
upstream prime_numbers_1 {
    zone prime_numbers_1 64k;
    resolver consul:8600 valid=5s;
    server service.consul service=prime_numbers_service_v1 resolve;
}
server {
    listen 80;

    add_header X-Backend $upstream_addr always;

    location /api/v1/fibonacci/ {
        proxy_pass http://fibonacci_1/;
    }
    location /api/v1/random/ {
            proxy_pass http://random_1/;
    }
    location /api/v1/prime_numbers/ {
                proxy_pass http://prime_numbers_1/;
        }


    location / {
        return 404;
    }
}
